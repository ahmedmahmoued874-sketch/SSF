<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ضاغط ملفات PDF</title>
    <!-- استدعاء المكتبات اللازمة من CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .upload-box {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 30px 20px;
            margin: 20px 0;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-box:hover {
            background: #ebf5fb;
        }
        input[type="file"] {
            display: none;
        }
        .controls {
            margin: 20px 0;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e8f8f5;
            border-radius: 8px;
            display: none;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ضغط ملفات PDF</h2>
    <p>اختر ملف PDF لتقليل حجمه مباشرة على جهازك</p>

    <label class="upload-box" for="pdfInput">
        <span id="fileName">اضغط هنا لاختيار ملف PDF</span>
        <input type="file" id="pdfInput" accept="application/pdf">
    </label>

    <div class="controls">
        <label for="qualityRange">مستوى الجودة (كلما قلّت زاد الضغط): <span id="qualityValue">50%</span></label>
        <input type="range" id="qualityRange" min="10" max="90" value="50">
    </div>

    <button id="compressBtn" disabled>ضغط الملف الآن</button>

    <div class="status" id="statusText"></div>

    <div class="result-box" id="resultBox">
        <p id="sizeInfo"></p>
        <a id="downloadLink" class="download-btn" download="compressed.pdf">تحميل الملف المضغوط</a>
    </div>
</div>

<script>
    // إعداد مسار العامل (Worker) لمكتبة PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const pdfInput = document.getElementById('pdfInput');
    const fileNameDisplay = document.getElementById('fileName');
    const qualityRange = document.getElementById('qualityRange');
    const qualityValue = document.getElementById('qualityValue');
    const compressBtn = document.getElementById('compressBtn');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const sizeInfo = document.getElementById('sizeInfo');
    const downloadLink = document.getElementById('downloadLink');

    let selectedFile = null;

    // تحديث نسبة الجودة المعروضة
    qualityRange.addEventListener('input', () => {
        qualityValue.textContent = qualityRange.value + '%';
    });

    // عند اختيار ملف
    pdfInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            selectedFile = e.target.files[0];
            fileNameDisplay.textContent = `الملف المختار: ${selectedFile.name} (${formatBytes(selectedFile.size)})`;
            compressBtn.disabled = false;
            resultBox.style.display = 'none';
            statusText.textContent = '';
        }
    });

    // عملية الضغط
    compressBtn.addEventListener('click', async () => {
        if (!selectedFile) return;

        compressBtn.disabled = true;
        resultBox.style.display = 'none';
        statusText.textContent = 'جاري قراءة الملف ومعالجة الصفحات...';

        const quality = parseInt(qualityRange.value) / 100;
        const fileReader = new FileReader();

        fileReader.onload = async function() {
            try {
                const typedarray = new Uint8Array(this.result);
                const pdf = await pdfjsLib.getDocument(typedarray).promise;
                const totalPages = pdf.numPages;

                const { jsPDF } = window.jspdf;
                let newPdf = null;

                for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
                    statusText.textContent = `جاري معالجة صفحة ${pageNum} من ${totalPages}...`;
                    
                    const page = await pdf.getPage(pageNum);
                    // تحديد دقة الرسم (1.5 تعطي توازناً جيداً بين الوضوح والحجم)
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    // تحويل الصفحة إلى صورة JPEG مضغوطة
                    const imgData = canvas.toDataURL('image/jpeg', quality);

                    // تحديد أبعاد الصفحة في ملف PDF الجديد
                    const orientation = viewport.width > viewport.height ? 'l' : 'p';
                    const pdfWidth = viewport.width * 0.264583; // تحويل من بكسل إلى ملم
                    const pdfHeight = viewport.height * 0.264583;

                    if (pageNum === 1) {
                        newPdf = new jsPDF({
                            orientation: orientation,
                            unit: 'mm',
                            format: [pdfWidth, pdfHeight]
                        });
                    } else {
                        newPdf.addPage([pdfWidth, pdfHeight], orientation);
                    }

                    newPdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                }

                statusText.textContent = 'تم الانتهاء من الضغط بنجاح!';
                const compressedBlob = newPdf.output('blob');
                const compressedUrl = URL.createObjectURL(compressedBlob);

                // عرض النتيجة
                const originalSize = formatBytes(selectedFile.size);
                const newSize = formatBytes(compressedBlob.size);
                const reduction = Math.round(((selectedFile.size - compressedBlob.size) / selectedFile.size) * 100);

                sizeInfo.innerHTML = `الحجم الأصلي: <b>${originalSize}</b> <br> الحجم الجديد: <b>${newSize}</b> <br> نسبة التوفير: <b>${reduction > 0 ? reduction + '%' : '0% (الملف مضغوط مسبقاً)'}</b>`;
                
                downloadLink.href = compressedUrl;
                downloadLink.download = 'compressed_' + selectedFile.name;
                resultBox.style.display = 'block';

            } catch (error) {
                console.error(error);
                statusText.textContent = 'حدث خطأ أثناء معالجة الملف. تأكد من أن الملف غير محمي بكلمة مرور.';
            } finally {
                compressBtn.disabled = false;
            }
        };

        fileReader.readAsArrayBuffer(selectedFile);
    });

    // دالة مساعدة لتحويل البايت إلى كيلوبايت/ميجابايت
    function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }
</script>

</body>
</html>
